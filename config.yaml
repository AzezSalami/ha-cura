arch:
  - amd64
audio: false
description: UltiMaker Cura 3D-printing slicer in your browser
devices:
  - /dev/dri
  - /dev/dri/card0
  - /dev/dri/card1
  - /dev/dri/renderD128
  - /dev/dri/renderD129
environment:
  FM_HOME: /config
  HOME: /config
  NO_GAMEPAD: "true"
  PGID: "0"
  PUID: "0"
  SELKIES_AUDIO_ENABLED: "false"
  SELKIES_ENABLE_SHARING: "false"
  SELKIES_GAMEPAD_ENABLED: "false"
  SELKIES_MICROPHONE_ENABLED: "false"
  START_DOCKER: "false"
  TITLE: Cura
  shm_size: 1gb
image: ghcr.io/azezsalami/cura-{arch}
ingress: true
init: false
map:
  - app_config:rw
  - share:rw
  - media:rw
  - ssl
name: Cura
options:
  env_vars: []
  DNS_server: 8.8.8.8
  PGID: 0
  PUID: 0
panel_admin: false
panel_icon: mdi:printer-3d-nozzle
ports:
  3000/tcp: null
  3001/tcp: null
ports_description:
  3000/tcp: Cura web interface (http)
  3001/tcp: Cura web interface (https)
privileged:
  - SYS_ADMIN
  - DAC_READ_SEARCH
schema:
  env_vars:
    - name: match(^[A-Za-z0-9_]+$)
      value: str?
  DNS_server: str?
  DRINODE: list(/dev/dri/card0|/dev/dri/card1|/dev/dri/card2|/dev/dri/renderD128|/dev/dri/renderD129|)?
  KEYBOARD: list(da-dk-qwerty|de-de-qwertz|en-gb-qwerty|en-us-qwerty|es-es-qwerty|fr-ch-qwertz|fr-fr-azerty|it-it-qwerty|ja-jp-qwerty|pt-br-qwerty|sv-se-qwerty|tr-tr-qwerty)?
  MAX_RES: match(^[1-9][0-9]{2,3}x[1-9][0-9]{2,3}$)?
  PASSWORD: str?
  PGID: int
  PIXELFLUX_WAYLAND: bool?
  PUID: int
  TZ: match([A-Z][a-z]*./[A-Z][a-z]*.)?
  additional_apps: str?
  cifsdomain: str?
  cifspassword: str?
  cifsusername: str?
  data_location: str?
  localdisks: str?
  networkdisks: str?
slug: cura
tmpfs: true
udev: true
url: https://github.com/AzezSalami/ha-cura
version: "5.13.0.161.3"
video: true
